<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<title>Page de connexion</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Work+Sans&display=swap" rel="stylesheet">
	<meta name="description" content="Connexion à l'espace d'administration de Sophie Bluel.">
	<link rel="stylesheet" href="./assets/style.css">
	<script type="module" src="assets/js/pages/login.js"></script>
</head>
<body>
<header>
	<h1>Sophie Bluel <span>Architecte d'intérieur</span></h1>
	<nav>
		<ul>
			<li><a href="index.html#portfolio">projets</a></li>
			<li><a href="index.html#contact">contact</a></li>
			<li><a href="login.html" id="login-link">login</a></li>
			<li><a href="https://www.instagram.com/" target="_blank" rel="noopener"><img src="./assets/icons/instagram.png" alt="Instagram"></a></li>
		</ul>
	</nav>
</header>
<main>
	<form id="login" action="#" method="post">
		<h2>Log In</h2>
		<label for="email">Email</label>
		<input type="email" name="email" id="email" autocomplete="username" required>
		<label for="password">Mot de passe</label>
		<div class="password-view">
			<input type="password" name="password" id="password" autocomplete="current-password" required>
			<button type="button" id="toggle-password" aria-controls="password">Afficher</button>
		</div>
		<input type="submit" value="Se connecter">
		<a href="#">Mot de passe oublié</a>
	</form>
</main>
<footer>
	<nav>
		<ul>
			<li><a href="#">Mentions Légales</a></li>
		</ul>
	</nav>
</footer>
</body>
</html>
